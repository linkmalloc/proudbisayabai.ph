<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Proud Bisaya Bai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css" />
  <script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core@2'
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2'
    import Image from 'https://esm.sh/@tiptap/extension-image@2'
    import Link from 'https://esm.sh/@tiptap/extension-link@2'

    const ResizableImage = Image.extend({
      addAttributes() {
        return {
          ...this.parent?.(),
          width: {
            default: null,
            parseHTML: el => el.style.width || el.getAttribute('width') || null,
            renderHTML: attrs => attrs.width ? { style: `width: ${attrs.width}` } : {},
          },
        }
      },
      addNodeView() {
        return ({ node, editor, getPos }) => {
          let currentNode = node

          const wrapper = document.createElement('div')
          wrapper.className = 'tiptap-image-wrapper'

          const img = document.createElement('img')
          img.src = node.attrs.src || ''
          img.alt = node.attrs.alt || ''
          if (node.attrs.width) img.style.width = node.attrs.width

          const handle = document.createElement('div')
          handle.className = 'tiptap-resize-handle'
          handle.contentEditable = 'false'

          wrapper.appendChild(img)
          wrapper.appendChild(handle)

          function applyResize(newWidth) {
            if (typeof getPos !== 'function') return
            editor.view.dispatch(
              editor.view.state.tr.setNodeMarkup(getPos(), undefined, {
                ...currentNode.attrs,
                width: newWidth + 'px',
              })
            )
          }

          // Mouse resize
          handle.addEventListener('mousedown', (e) => {
            e.preventDefault()
            e.stopPropagation()
            const startX = e.clientX
            const startWidth = img.offsetWidth || img.naturalWidth || 300
            const onMove = (e) => {
              img.style.width = Math.max(50, startWidth + e.clientX - startX) + 'px'
            }
            const onUp = () => {
              applyResize(parseInt(img.style.width) || startWidth)
              document.removeEventListener('mousemove', onMove)
              document.removeEventListener('mouseup', onUp)
            }
            document.addEventListener('mousemove', onMove)
            document.addEventListener('mouseup', onUp)
          })

          // Touch resize
          handle.addEventListener('touchstart', (e) => {
            e.preventDefault()
            e.stopPropagation()
            const startX = e.touches[0].clientX
            const startWidth = img.offsetWidth || img.naturalWidth || 300
            const onMove = (e) => {
              img.style.width = Math.max(50, startWidth + e.touches[0].clientX - startX) + 'px'
            }
            const onEnd = () => {
              applyResize(parseInt(img.style.width) || startWidth)
              document.removeEventListener('touchmove', onMove)
              document.removeEventListener('touchend', onEnd)
            }
            document.addEventListener('touchmove', onMove, { passive: false })
            document.addEventListener('touchend', onEnd)
          }, { passive: false })

          return {
            dom: wrapper,
            update(updatedNode) {
              if (updatedNode.type.name !== 'image') return false
              currentNode = updatedNode
              img.src = updatedNode.attrs.src || ''
              img.alt = updatedNode.attrs.alt || ''
              img.style.width = updatedNode.attrs.width || ''
              return true
            },
            selectNode() { wrapper.classList.add('selected') },
            deselectNode() { wrapper.classList.remove('selected') },
          }
        }
      },
    })

    window.TiptapEditor = Editor
    window.TiptapStarterKit = StarterKit
    window.TiptapImage = ResizableImage
    window.TiptapLink = Link
  </script>
</head>
<body class="min-h-screen bg-gray-100">

  <div id="app" class="min-h-screen flex flex-col bg-gray-100">
    <!-- Validation overlay -->
    <div v-if="validating" class="fixed inset-0 bg-gray-100 flex items-center justify-center z-50">
      <p class="text-gray-400 text-sm">Verifying session…</p>
    </div>

    <template v-else>
      <!-- Header -->
      <header class="bg-white shadow-sm px-4 py-4 flex items-center justify-between z-30 relative">
        <div class="flex items-center gap-3">
          <button @click="sidebarOpen = !sidebarOpen"
            class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 transition"
            :title="sidebarOpen ? 'Close sidebar' : 'Open sidebar'">
            <svg v-if="!sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
          <img src="https://d1rl40o93nnuyl.cloudfront.net/posts/567/892e461772016837-17.png" alt="Proud Bisaya Bai" class="h-8 w-auto" />
          <span class="text-sm text-gray-400 hidden sm:inline">Admin</span>
        </div>
        <button @click="logout" class="text-sm text-gray-500 hover:text-red-500 transition">Sign out</button>
      </header>

      <!-- Body -->
      <div class="flex flex-1 overflow-hidden relative">

        <!-- Mobile backdrop -->
        <transition name="fade">
          <div v-if="sidebarOpen && isMobile"
            @click="sidebarOpen = false"
            class="fixed inset-0 bg-black/40 z-20">
          </div>
        </transition>

        <!-- Sidebar — overlay on mobile, inline on desktop -->
        <aside :class="[
            isMobile
              ? ['fixed top-[57px] left-0 h-[calc(100vh-57px)] z-30 shadow-xl transition-transform duration-300 ease-in-out w-56',
                 sidebarOpen ? 'translate-x-0' : '-translate-x-full']
              : ['relative flex-shrink-0 overflow-y-auto transition-all duration-300 ease-in-out shadow-md',
                 sidebarOpen ? 'w-56' : 'w-0 overflow-hidden']
          ].flat()"
          class="bg-white">
          <nav class="py-4 w-56">

            <!-- Posts group -->
            <div>
              <button @click="toggleGroup('posts')"
                class="w-full flex items-center justify-between px-5 py-3 md:py-2 text-sm md:text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-gray-600 transition">
                <span class="w-full text-center md:text-left">Posts</span>
                <svg :class="openGroups.posts ? 'rotate-180' : ''"
                  class="w-4 h-4 md:w-3.5 md:h-3.5 transition-transform duration-200"
                  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div v-show="openGroups.posts">
                <button @click="navigate('all-posts')"
                  :class="currentPage === 'all-posts' ? 'bg-orange-50 text-orange-600 font-semibold' : 'text-gray-600 hover:bg-gray-50'"
                  class="w-full text-center md:text-left md:px-8 py-3 md:py-2 text-base md:text-sm transition">
                  All Posts
                </button>
                <button @click="navigate('archived-posts')"
                  :class="currentPage === 'archived-posts' ? 'bg-orange-50 text-orange-600 font-semibold' : 'text-gray-600 hover:bg-gray-50'"
                  class="w-full text-center md:text-left md:px-8 py-3 md:py-2 text-base md:text-sm transition">
                  Archived Posts
                </button>
              </div>
            </div>

            <!-- Divider -->
            <div class="my-2 mx-5 border-t border-gray-100"></div>

            <!-- Short URL -->
            <div class="px-5 py-3 md:py-2 flex flex-col md:flex-row items-center md:justify-between gap-1 md:gap-0">
              <span class="text-sm md:text-xs font-semibold uppercase tracking-wider text-gray-400">Short URL</span>
              <span class="text-xs bg-gray-100 text-gray-400 px-1.5 py-0.5 rounded font-medium">Soon</span>
            </div>

          </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8" v-show="!previewPost && !editingPost">

          <!-- All Posts -->
          <template v-if="currentPage === 'all-posts'">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-3">
                <h2 class="text-lg font-semibold text-gray-700">All Posts</h2>
                <span v-if="pagination.total" class="text-xs text-gray-400">{{ pagination.total }} posts</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="relative">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                  </svg>
                  <input
                    v-model="search"
                    @input="onSearch"
                    type="text"
                    placeholder="Search…"
                    class="pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-400 w-36 sm:w-64"
                  />
                </div>
                <button @click="onSearch" class="md:hidden px-3 py-2 text-sm font-medium text-white rounded-lg" style="background: linear-gradient(135deg, #f95c00, #ff7a1a)">
                  Search
                </button>
                <button @click="createPost" :disabled="creatingPost"
                  class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-white rounded-lg disabled:opacity-60 transition"
                  style="background: linear-gradient(135deg, #f95c00, #ff7a1a)">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                  </svg>
                  <span class="sm:hidden">Create</span>
                  <span class="hidden sm:inline">New Article</span>
                </button>
              </div>
            </div>

            <p v-if="loadingPosts" class="text-gray-400 text-sm">Loading posts…</p>
            <p v-else-if="postsError" class="text-red-400 text-sm">{{ postsError }}</p>
            <p v-else-if="!posts.length" class="text-gray-400 text-sm">No posts found.</p>

            <template v-else>
              <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="overflow-x-auto">
                  <table class="w-full text-sm md:min-w-[480px]">
                    <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                      <tr>
                        <th class="px-5 py-3 text-left w-32 hidden md:table-cell"></th>
                        <th class="px-5 py-3 text-left max-w-0 w-full">Post</th>
                        <th class="px-5 py-3 text-left whitespace-nowrap hidden md:table-cell">Author</th>
                        <th class="px-5 py-3 text-left whitespace-nowrap hidden md:table-cell">Date</th>
                        <th class="px-5 py-3 text-left hidden md:table-cell">Status</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap w-24 sticky right-0 bg-gray-50">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                      <tr v-for="post in posts" :key="post.id" class="hover:bg-gray-50 transition" @click="isMobile && openActionSheet(post)">
                        <td class="px-5 py-3 hidden md:table-cell">
                          <div class="w-full relative rounded-lg overflow-hidden bg-gray-100" style="aspect-ratio: 1200/630;">
                            <img
                              v-if="post.fm.img_big_1000x600"
                              :src="post.fm.img_big_1000x600"
                              class="absolute inset-0 w-full h-full object-cover block"
                              loading="lazy"
                            />
                          </div>
                        </td>
                        <td class="px-5 py-3 font-medium text-gray-800 max-w-0 w-full">
                          <!-- Title -->
                          <span class="text-xs md:text-sm">{{ post.fm.title ?? '—' }}</span>
                          <!-- Mobile: image + cats/tags side by side, below title -->
                          <div class="md:hidden mt-1.5 flex gap-2 items-start">
                            <div v-if="post.fm.img_big_1000x600" class="flex-1 min-w-0 rounded-lg overflow-hidden bg-gray-100" style="aspect-ratio: 1200/630;">
                              <img :src="post.fm.img_big_1000x600" class="w-full h-full object-cover" loading="lazy" />
                            </div>
                            <div class="flex-1 min-w-0 flex flex-col gap-1 pt-0.5">
                              <div class="flex flex-wrap gap-1 items-center">
                                <span v-for="cat in post.fm.categories" :key="cat" class="px-1.5 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-600">{{ cat }}</span>
                                <span :class="post.published ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'" class="px-1.5 py-0.5 rounded-full text-xs font-medium">{{ post.published ? 'Published' : 'Draft' }}</span>
                              </div>
                              <div v-if="post.fm.tags?.length" class="flex flex-wrap gap-1">
                                <span v-for="tag in post.fm.tags" :key="tag" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">#{{ tag }}</span>
                              </div>
                            </div>
                          </div>
                          <!-- Desktop only: description + cats/tags -->
                          <p v-if="post.fm.description" class="hidden md:block text-[11px] font-light text-gray-400 mt-0.5 leading-snug line-clamp-2">{{ post.fm.description }}</p>
                          <div v-if="post.fm.categories?.length || post.fm.tags?.length" class="hidden md:flex flex-wrap gap-1 mt-1.5">
                            <span v-for="cat in post.fm.categories" :key="cat" class="px-1.5 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-600">{{ cat }}</span>
                            <span v-for="tag in post.fm.tags.slice(0, 5)" :key="tag" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">#{{ tag }}</span>
                            <span v-if="post.fm.tags?.length > 5" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-400">+{{ post.fm.tags.length - 5 }}</span>
                          </div>
                        </td>
                        <td class="px-5 py-3 text-gray-500 whitespace-nowrap hidden md:table-cell">{{ post.fm.author ?? '—' }}</td>
                        <td class="px-5 py-3 text-gray-500 whitespace-nowrap hidden md:table-cell">
                          {{ post.fm.published_at || post.fm.published_date || post.published_at ? new Date(post.fm.published_at || post.fm.published_date || post.published_at).toLocaleDateString() : '—' }}
                        </td>
                        <td class="px-5 py-3 hidden md:table-cell">
                          <span :class="post.published ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                            class="px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap">
                            {{ post.published ? 'Published' : 'Draft' }}
                          </span>
                        </td>
                        <td class="px-3 py-3 sticky right-0 bg-white hover:bg-gray-50 transition-colors">
                          <!-- Mobile: ⋯ button -->
                          <button @click.stop="openActionSheet(post)" class="md:hidden p-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 active:bg-gray-300 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                              <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                            </svg>
                          </button>
                          <!-- Desktop: icon buttons -->
                          <div class="hidden md:flex items-center gap-1 flex-nowrap">
                            <button @click="viewPost(post)" title="View"
                              class="p-1.5 rounded-md text-blue-500 hover:text-blue-700 hover:bg-blue-50 transition">
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                              </svg>
                            </button>
                            <button @click="editPost(post)" title="Edit"
                              class="p-1.5 rounded-md text-blue-500 hover:text-blue-700 hover:bg-blue-50 transition">
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                              </svg>
                            </button>
                            <button @click="deletePost(post)" title="Delete"
                              class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 transition">
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                              </svg>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Pagination -->
              <div class="mt-4 flex items-center justify-between gap-2 flex-wrap">
                <p class="text-xs text-gray-400">
                  Page {{ pagination.page }} of {{ pagination.total_pages }}
                </p>
                <div class="flex items-center gap-1">
                  <!-- Prev -->
                  <button @click="goToPage(pagination.page - 1)" :disabled="pagination.page === 1"
                    class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    &larr;
                  </button>

                  <!-- First page + ellipsis -->
                  <template v-if="pageNumbers()[0] > 1">
                    <button @click="goToPage(1)" class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 transition">1</button>
                    <span v-if="pageNumbers()[0] > 2" class="px-1 text-gray-400 text-xs">…</span>
                  </template>

                  <!-- Page window -->
                  <button v-for="p in pageNumbers()" :key="p" @click="goToPage(p)"
                    :class="p === pagination.page ? 'bg-orange-500 text-white border-orange-500' : 'text-gray-500 border-gray-200 hover:bg-gray-50'"
                    class="px-3 py-1.5 text-xs rounded-md border transition">
                    {{ p }}
                  </button>

                  <!-- Last page + ellipsis -->
                  <template v-if="pageNumbers()[pageNumbers().length - 1] < pagination.total_pages">
                    <span v-if="pageNumbers()[pageNumbers().length - 1] < pagination.total_pages - 1" class="px-1 text-gray-400 text-xs">…</span>
                    <button @click="goToPage(pagination.total_pages)" class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 transition">{{ pagination.total_pages }}</button>
                  </template>

                  <!-- Next -->
                  <button @click="goToPage(pagination.page + 1)" :disabled="pagination.page === pagination.total_pages"
                    class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    &rarr;
                  </button>
                </div>
              </div>
            </template>
          </template>

          <!-- Archived Posts -->
          <template v-else-if="currentPage === 'archived-posts'">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-3">
                <h2 class="text-lg font-semibold text-gray-700">Archived Posts</h2>
                <span v-if="archivedPagination.total" class="text-xs text-gray-400">{{ archivedPagination.total }} posts</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="relative">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                  </svg>
                  <input
                    v-model="archivedSearch"
                    @input="onArchivedSearch"
                    type="text"
                    placeholder="Search…"
                    class="pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-400 w-36 sm:w-64"
                  />
                </div>
                <button @click="onArchivedSearch" class="md:hidden px-3 py-2 text-sm font-medium text-white rounded-lg" style="background: linear-gradient(135deg, #f95c00, #ff7a1a)">
                  Search
                </button>
              </div>
            </div>

            <p v-if="loadingArchivedPosts" class="text-gray-400 text-sm">Loading archived posts…</p>
            <p v-else-if="archivedPostsError" class="text-red-400 text-sm">{{ archivedPostsError }}</p>
            <p v-else-if="!archivedPosts.length" class="text-gray-400 text-sm">No archived posts yet.</p>

            <template v-else>
              <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="overflow-x-auto">
                  <table class="w-full text-sm md:min-w-[480px]">
                    <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                      <tr>
                        <th class="px-5 py-3 text-left w-32 hidden md:table-cell"></th>
                        <th class="px-5 py-3 text-left max-w-0 w-full">Post</th>
                        <th class="px-5 py-3 text-left whitespace-nowrap hidden md:table-cell">Author</th>
                        <th class="px-5 py-3 text-left whitespace-nowrap hidden md:table-cell">Date</th>
                        <th class="px-3 py-3 text-left whitespace-nowrap w-24 sticky right-0 bg-gray-50">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                      <tr v-for="post in archivedPosts" :key="post.id" class="hover:bg-gray-50 transition">
                        <td class="px-5 py-3 hidden md:table-cell">
                          <div class="w-full relative rounded-lg overflow-hidden bg-gray-100" style="aspect-ratio: 1200/630;">
                            <img
                              v-if="post.fm.img_big_1000x600"
                              :src="post.fm.img_big_1000x600"
                              class="absolute inset-0 w-full h-full object-cover block"
                              loading="lazy"
                            />
                          </div>
                        </td>
                        <td class="px-5 py-3 font-medium text-gray-800 max-w-0 w-full">
                          <span class="text-xs md:text-sm">{{ post.fm.title ?? '—' }}</span>
                          <div class="md:hidden mt-1.5 flex gap-2 items-start">
                            <div v-if="post.fm.img_big_1000x600" class="flex-1 min-w-0 rounded-lg overflow-hidden bg-gray-100" style="aspect-ratio: 1200/630;">
                              <img :src="post.fm.img_big_1000x600" class="w-full h-full object-cover" loading="lazy" />
                            </div>
                            <div class="flex-1 min-w-0 flex flex-col gap-1 pt-0.5">
                              <div class="flex flex-wrap gap-1 items-center">
                                <span v-for="cat in post.fm.categories" :key="cat" class="px-1.5 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-600">{{ cat }}</span>
                                <span class="px-1.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">Archived</span>
                              </div>
                              <div v-if="post.fm.tags?.length" class="flex flex-wrap gap-1">
                                <span v-for="tag in post.fm.tags" :key="tag" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">#{{ tag }}</span>
                              </div>
                            </div>
                          </div>
                          <p v-if="post.fm.description" class="hidden md:block text-[11px] font-light text-gray-400 mt-0.5 leading-snug line-clamp-2">{{ post.fm.description }}</p>
                          <div v-if="post.fm.categories?.length || post.fm.tags?.length" class="hidden md:flex flex-wrap gap-1 mt-1.5">
                            <span v-for="cat in post.fm.categories" :key="cat" class="px-1.5 py-0.5 rounded text-xs font-medium bg-orange-100 text-orange-600">{{ cat }}</span>
                            <span v-for="tag in post.fm.tags.slice(0, 5)" :key="tag" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">#{{ tag }}</span>
                            <span v-if="post.fm.tags?.length > 5" class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-400">+{{ post.fm.tags.length - 5 }}</span>
                          </div>
                        </td>
                        <td class="px-5 py-3 text-gray-500 whitespace-nowrap hidden md:table-cell">{{ post.fm.author ?? '—' }}</td>
                        <td class="px-5 py-3 text-gray-500 whitespace-nowrap hidden md:table-cell">
                          {{ post.fm.published_at || post.fm.published_date || post.published_at ? new Date(post.fm.published_at || post.fm.published_date || post.published_at).toLocaleDateString() : '—' }}
                        </td>
                        <td class="px-3 py-3 sticky right-0 bg-white hover:bg-gray-50 transition-colors">
                          <div class="flex items-center gap-1 flex-nowrap">
                            <button @click="viewPost(post)" title="View"
                              class="p-1.5 rounded-md text-blue-500 hover:text-blue-700 hover:bg-blue-50 transition hidden md:inline-flex">
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                              </svg>
                            </button>
                            <button @click="unarchivePost(post)" title="Unarchive"
                              class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium rounded-md text-green-600 hover:text-white hover:bg-green-600 border border-green-200 hover:border-green-600 transition">
                              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h11a4 4 0 014 4v6m0 0l-3-3m3 3l3-3"/>
                              </svg>
                              Unarchive
                            </button>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Pagination -->
              <div class="mt-4 flex items-center justify-between gap-2 flex-wrap">
                <p class="text-xs text-gray-400">
                  Page {{ archivedPagination.page }} of {{ archivedPagination.total_pages }}
                </p>
                <div class="flex items-center gap-1">
                  <button @click="goToArchivedPage(archivedPagination.page - 1)" :disabled="archivedPagination.page === 1"
                    class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    &larr;
                  </button>

                  <template v-if="archivedPageNumbers()[0] > 1">
                    <button @click="goToArchivedPage(1)" class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 transition">1</button>
                    <span v-if="archivedPageNumbers()[0] > 2" class="px-1 text-gray-400 text-xs">…</span>
                  </template>

                  <button v-for="p in archivedPageNumbers()" :key="p" @click="goToArchivedPage(p)"
                    :class="p === archivedPagination.page ? 'bg-orange-500 text-white border-orange-500' : 'text-gray-500 border-gray-200 hover:bg-gray-50'"
                    class="px-3 py-1.5 text-xs rounded-md border transition">
                    {{ p }}
                  </button>

                  <template v-if="archivedPageNumbers()[archivedPageNumbers().length - 1] < archivedPagination.total_pages">
                    <span v-if="archivedPageNumbers()[archivedPageNumbers().length - 1] < archivedPagination.total_pages - 1" class="px-1 text-gray-400 text-xs">…</span>
                    <button @click="goToArchivedPage(archivedPagination.total_pages)" class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 transition">{{ archivedPagination.total_pages }}</button>
                  </template>

                  <button @click="goToArchivedPage(archivedPagination.page + 1)" :disabled="archivedPagination.page === archivedPagination.total_pages"
                    class="px-3 py-1.5 text-xs rounded-md border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    &rarr;
                  </button>
                </div>
              </div>
            </template>
          </template>

          <!-- Short URL (Coming Soon) -->
          <template v-else-if="currentPage === 'short-url'">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Short URL</h2>
            <p class="text-gray-400 text-sm">Coming soon.</p>
          </template>

        </main>
      </div>
      <!-- Edit Drawer -->
      <transition name="edit-drawer">
        <div v-if="editingPost" class="fixed inset-0 z-50 flex justify-end">
          <div class="absolute inset-0 bg-black/50" @click="closeEditor"></div>
          <div class="relative w-full bg-white shadow-2xl flex flex-col h-full overflow-hidden">

            <!-- Edit drawer header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 flex-shrink-0">
              <div class="flex items-center gap-3">
                <button @click="closeEditor()" class="p-1.5 rounded-md text-gray-400 hover:bg-gray-100 transition" title="Back">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                  </svg>
                </button>
                <span class="text-sm font-semibold text-gray-700">Edit Post</span>
                <span class="text-xs text-gray-400 hidden sm:inline">{{ editTitle }}</span>
              </div>
              <div class="flex items-center gap-2">
                <!-- Desktop preview + save -->
                <template v-if="!isMobile">
                  <button @click="viewPost(editingPost)"
                    class="px-4 py-1.5 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">
                    Preview
                  </button>
                  <button @click="savePost()" :disabled="saving"
                    class="px-4 py-1.5 text-sm bg-orange-500 text-white rounded-lg hover:bg-orange-600 disabled:opacity-50 transition font-medium">
                    {{ saving ? 'Saving…' : 'Save' }}
                  </button>
                  <button v-if="editingPost" @click="savePost(true)" :disabled="saving"
                    class="px-4 py-1.5 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 transition font-medium">
                    {{ saving ? (editingPost.published ? 'Republishing…' : 'Publishing…') : (editingPost.published ? 'Republish' : 'Publish') }}
                  </button>
                </template>
                <button @click="closeEditor" class="p-1.5 rounded-md text-gray-400 hover:bg-gray-100 transition">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Mobile action bar: Preview / Save / Publish -->
            <div v-if="isMobile" class="flex items-center gap-2 px-4 py-2 border-b border-gray-100 flex-shrink-0">
              <button @click="viewPost(editingPost)"
                class="flex-1 px-3 py-1.5 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition font-medium">
                Preview
              </button>
              <button @click="savePost()" :disabled="saving"
                class="flex-1 px-3 py-1.5 text-sm bg-orange-500 text-white rounded-lg hover:bg-orange-600 disabled:opacity-50 transition font-medium">
                {{ saving ? 'Saving…' : 'Save' }}
              </button>
              <button v-if="editingPost" @click="savePost(true)" :disabled="saving"
                class="flex-1 px-3 py-1.5 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 transition font-medium">
                {{ saving ? (editingPost.published ? 'Republishing…' : 'Publishing…') : (editingPost.published ? 'Republish' : 'Publish') }}
              </button>
            </div>

            <!-- Mobile step indicator -->
            <div v-if="isMobile" class="flex border-b border-gray-100 flex-shrink-0">
              <button @click="editStep = 1"
                :class="editStep === 1 ? 'border-b-2 border-orange-500 text-orange-600 font-semibold' : 'text-gray-400'"
                class="flex-1 py-2.5 text-xs text-center transition">
                1. Metadata
              </button>
              <button @click="editStep = 2"
                :class="editStep === 2 ? 'border-b-2 border-orange-500 text-orange-600 font-semibold' : 'text-gray-400'"
                class="flex-1 py-2.5 text-xs text-center transition">
                2. Content
              </button>
            </div>

            <!-- Edit drawer body -->
            <div class="flex-1 overflow-hidden flex">

              <!-- Left panel: meta fields -->
              <div v-show="!isMobile || editStep === 1"
                class="flex-shrink-0 border-r border-gray-200 flex flex-col"
                :class="isMobile ? 'w-full' : 'w-1/3 bg-gray-50'">

                <!-- Desktop tabs -->
                <div v-if="!isMobile" class="flex border-b border-gray-200 flex-shrink-0">
                  <button v-for="tab in [{key:'metadata',label:'Metadata'},{key:'seo',label:'SEO'},{key:'images',label:'Images'}]"
                    :key="tab.key" @click="editMetaTab = tab.key"
                    :class="editMetaTab === tab.key ? 'border-b-2 border-orange-500 text-orange-600 font-semibold' : 'text-gray-400 hover:text-gray-600'"
                    class="flex-1 py-2.5 text-xs text-center transition">
                    {{ tab.label }}
                  </button>
                </div>

                <!-- Tab / mobile content -->
                <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-4">

                  <button @click="autopopulate" :disabled="autopopulating || !canAutopopulate" type="button"
                    :title="canAutopopulate ? 'Autofill metadata and SEO from article content' : 'Write at least 50 words in the article content first'"
                    class="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs font-semibold rounded-lg bg-gradient-to-r from-purple-500 to-orange-500 text-white hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                    {{ autopopulating ? 'Populating…' : 'AI Populate' }}
                  </button>

                  <!-- METADATA tab -->
                  <template v-if="isMobile || editMetaTab === 'metadata'">
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Title</label>
                      <textarea v-model="editTitle" rows="3" @input="titleInvalid = false" @blur="onTitleBlur"
                        :class="titleInvalid ? 'border-red-500 ring-1 ring-red-500' : 'border-gray-200'"
                        class="w-full px-3 py-2 border rounded-lg text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition resize-none"></textarea>
                    </div>
                    <div>
                      <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Description</label>
                        <button @click="suggestDescription" type="button"
                          class="px-2.5 py-1 text-xs font-medium rounded-md bg-orange-50 text-orange-600 hover:bg-orange-100 border border-orange-200 transition">
                          Suggest from article content
                        </button>
                      </div>
                      <textarea v-model="editDescription" rows="4" @input="descriptionInvalid = false"
                        :class="descriptionInvalid ? 'border-red-500 ring-1 ring-red-500' : 'border-gray-200'"
                        class="w-full px-3 py-2 border rounded-lg text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition resize-none"></textarea>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Author</label>
                      <input v-model="editAuthor" type="text" list="author-suggestions" autocomplete="off" @input="authorInvalid = false"
                        :class="authorInvalid ? 'border-red-500 ring-1 ring-red-500' : 'border-gray-200'"
                        class="w-full px-3 py-2 border rounded-lg text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
                      <datalist id="author-suggestions">
                        <option v-for="a in authorSuggestions" :key="a" :value="a"></option>
                      </datalist>
                    </div>
                  </template>

                  <!-- SEO tab -->
                  <template v-if="isMobile || editMetaTab === 'seo'">
                    <div v-if="isMobile" class="border-t border-gray-100 pt-4">
                      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">SEO</p>
                    </div>
                    <div>
                      <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Slug Title</label>
                        <span :class="editSlugTitle.length >= 50 ? 'text-red-400' : 'text-gray-300'" class="text-xs">{{ editSlugTitle.length }}/50</span>
                      </div>
                      <input v-model="editSlugTitle" type="text" placeholder="custom-url-slug" maxlength="50"
                        :disabled="editingPost && editingPost.published"
                        @blur="editSlugTitle = slugify(editSlugTitle)"
                        :class="editingPost && editingPost.published ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-800'"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-orange-400 transition font-mono" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Category</label>
                      <div class="relative">
                        <select ref="categorySelect" v-model="editCategory" @change="categoryInvalid = false"
                          :class="categoryInvalid ? 'border-red-500 ring-1 ring-red-500' : 'border-gray-200 focus:ring-orange-400'"
                          class="w-full appearance-none px-4 py-3 pr-10 border rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 transition bg-white shadow-sm cursor-pointer">
                          <option value="">— Select category —</option>
                          <option v-for="cat in postCategories" :key="cat" :value="cat" class="capitalize">{{ cat }}</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
                          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Tags <span class="text-gray-300 font-normal normal-case tracking-normal">(comma or Enter)</span></label>
                      <input v-model="editTagsRaw" type="text" placeholder="Add a tag…"
                        @input="addTag(); tagsInvalid = false" @keydown.enter.prevent="addTagOnEnter(); tagsInvalid = false"
                        :class="tagsInvalid ? 'border-red-500 ring-1 ring-red-500' : 'border-gray-200'"
                        class="w-full px-3 py-2 border rounded-lg text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
                      <div v-if="editTags.length" class="flex flex-wrap gap-2 mt-2">
                        <span v-for="tag in editTags" :key="tag"
                          class="flex items-center gap-1.5 px-3 py-1 bg-orange-50 text-orange-600 text-sm font-medium rounded-full">
                          {{ tag }}
                          <button @click="removeTag(tag)" class="flex items-center justify-center w-4 h-4 rounded-full bg-orange-200 hover:bg-orange-400 hover:text-white text-orange-600 transition text-xs leading-none">&times;</button>
                        </span>
                      </div>
                    </div>
                  </template>

                  <!-- IMAGES tab -->
                  <template v-if="isMobile || editMetaTab === 'images'">
                    <div v-if="isMobile" class="border-t border-gray-100 pt-4">
                      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Images</p>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Feature Image</label>
                      <input v-model="editFeatureImage" type="url" placeholder="https://…"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition font-mono mb-2" />
                      <div class="relative rounded-lg overflow-hidden bg-gray-100 cursor-pointer group"
                        style="aspect-ratio:1200/630;"
                        :class="featureImageDragOver ? 'ring-2 ring-orange-400 ring-offset-1' : ''"
                        @click="$refs.featureFileInput.click()"
                        @dragover.prevent="featureImageDragOver = true"
                        @dragleave="featureImageDragOver = false"
                        @drop.prevent="onFeatureImageDrop">
                        <img v-if="editFeatureImagePreview || editFeatureImage"
                          :src="editFeatureImagePreview || editFeatureImage"
                          class="w-full h-full object-cover pointer-events-none" />
                        <div v-else class="w-full h-full flex items-center justify-center text-gray-400 text-xs">No image</div>
                        <div class="absolute inset-0 flex flex-col items-center justify-center gap-1 transition"
                          :class="featureImageDragOver ? 'bg-orange-500/60 opacity-100' : 'bg-black/40 opacity-0 group-hover:opacity-100'">
                          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                          </svg>
                          <span class="text-white text-xs font-medium">{{ featureImageDragOver ? 'Drop to set' : 'Click to upload' }}</span>
                        </div>
                        <button v-if="editFeatureImagePreview || editFeatureImage"
                          @click.stop="clearFeatureImage" title="Remove"
                          class="absolute top-2 right-2 w-6 h-6 rounded-full bg-black/60 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition hover:bg-red-500 text-base leading-none z-10">
                          &times;
                        </button>
                      </div>
                      <input ref="featureFileInput" type="file" accept="image/*" class="hidden" @change="onFeatureImageFile" />
                      <p v-if="editFeatureImageFile" class="text-xs text-gray-400 mt-1 truncate">{{ editFeatureImageFile.name }}</p>
                    </div>

                    <!-- Upload attachments -->
                    <div class="border-t border-gray-100 pt-4 mt-2">
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Upload Images</label>

                      <!-- Drop zone -->
                      <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition"
                        @click="$refs.attachmentInput.click()"
                        @dragover.prevent
                        @drop.prevent="onAttachmentDrop">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-300 mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <p class="text-xs text-gray-400">Click or drag images here</p>
                        <p class="text-xs text-gray-300 mt-0.5">PNG, JPG, WEBP</p>
                      </div>
                      <input ref="attachmentInput" type="file" accept="image/*" multiple class="hidden" @change="onAttachmentSelect" />

                      <!-- Upload queue -->
                      <div v-if="attachmentQueue.length" class="mt-3 flex flex-col gap-2">
                        <div v-for="item in attachmentQueue" :key="item.id"
                          class="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">
                          <img :src="item.preview" class="w-10 h-10 object-cover rounded flex-shrink-0" />
                          <div class="flex-1 min-w-0">
                            <p class="text-xs text-gray-700 truncate">{{ item.file.name }}</p>
                            <div v-if="item.status === 'uploading'" class="mt-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                              <div class="h-full bg-orange-400 rounded-full animate-pulse" style="width: 60%"></div>
                            </div>
                            <p v-else-if="item.status === 'done'" class="text-xs text-green-600 mt-0.5">✓ Uploaded</p>
                            <p v-else-if="item.status === 'error'" class="text-xs text-red-500 mt-0.5">{{ item.error }}</p>
                          </div>
                          <button v-if="item.status === 'error'" @click="retryAttachment(item)"
                            class="text-xs text-orange-500 hover:text-orange-700 flex-shrink-0">Retry</button>
                          <button v-if="item.status !== 'uploading'" @click="removeAttachment(item.id)"
                            class="text-gray-300 hover:text-red-500 transition flex-shrink-0 text-lg leading-none">&times;</button>
                        </div>
                      </div>

                      <!-- Uploaded images -->
                      <div v-if="uploadedImages.length" class="mt-4">
                        <p class="text-xs text-gray-400 mb-2">Uploaded</p>
                        <div class="grid grid-cols-2 gap-2">
                          <div v-for="(img, i) in uploadedImages" :key="img.blob_id"
                            class="relative group rounded-lg overflow-hidden bg-gray-100 cursor-pointer" style="aspect-ratio:1/1;"
                            :class="selectedImageBlobId === img.blob_id ? 'ring-2 ring-orange-500' : ''"
                            draggable="true"
                            @click="selectedImageBlobId = selectedImageBlobId === img.blob_id ? null : img.blob_id"
                            @dragstart="onImageDragStart($event, img.key)">
                            <img :src="toCloudFrontUrl(img.key)" class="w-full h-full object-cover pointer-events-none" />
                            <div class="absolute inset-0 bg-black/40 transition flex flex-col items-center justify-center gap-1.5 p-2"
                              :class="selectedImageBlobId === img.blob_id ? 'opacity-100' : 'opacity-0 group-hover:opacity-100 pointer-events-none'">
                              <button @click.stop="setFeatureImage(img)" title="Set as feature image"
                                class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 bg-orange-500 text-white rounded-lg text-xs font-medium hover:bg-orange-600 transition shadow">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                Set as Feature
                              </button>
                              <button @click.stop="copyImageUrl(img.key, i)" title="Copy URL"
                                class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 bg-white rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-100 transition shadow">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                {{ copiedImageIndex === i ? 'Copied!' : 'Copy URL' }}
                              </button>
                            </div>
                            <button @click.stop="deleteUploadedImage(img)" title="Remove"
                              class="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/60 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition hover:bg-red-500 text-sm leading-none z-10">
                              &times;
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>

                </div>
              </div>

              <!-- Right panel: WYSIWYG editor -->
              <div v-show="!isMobile || editStep === 2" :class="activeEditor === 'markdown' ? 'is-markdown' : ''" class="flex-1 overflow-hidden flex flex-col">
                <!-- Editor toggle bar -->
                <div class="flex items-center justify-between gap-1 px-3 py-1.5 border-b border-gray-100 bg-gray-50 flex-shrink-0">
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400 mr-2 hidden">Editor</span>
                    <div class="flex bg-gray-200 rounded-lg p-0.5 gap-0.5">
                      <button @click="switchToEditor('quill')"
                        :class="activeEditor === 'quill' ? 'bg-white shadow-sm text-gray-800 font-medium' : 'text-gray-500 hover:text-gray-700'"
                        class="px-3 py-1 text-xs rounded-md transition">
                        Editor
                      </button>
                      <button @click="switchToEditor('tiptap')"
                        :class="activeEditor === 'tiptap' ? 'bg-white shadow-sm text-gray-800 font-medium' : 'text-gray-500 hover:text-gray-700'"
                        class="px-3 py-1 text-xs rounded-md transition hidden">
                        Tiptap
                      </button>
                      <button @click="switchToEditor('markdown')"
                        :class="activeEditor === 'markdown' ? 'bg-white shadow-sm text-gray-800 font-medium' : 'text-gray-500 hover:text-gray-700'"
                        class="px-3 py-1 text-xs rounded-md transition">
                        Markdown
                      </button>
                    </div>
                  </div>
                  <div class="flex items-center gap-2 text-xs text-gray-500">
                    <span title="Word count">{{ bodyWordCount }} {{ bodyWordCount === 1 ? 'word' : 'words' }}</span>
                    <span class="text-gray-300">•</span>
                    <span class="flex items-center gap-1" title="Estimated read time">
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                      </svg>
                      {{ currentReadTime }}
                    </span>
                  </div>
                </div>
                <!-- Quill editor -->
                <div v-show="activeEditor === 'quill'" id="quill-editor" class="flex-1 overflow-y-auto text-gray-800 text-sm"></div>
                <!-- Tiptap editor -->
                <div v-show="activeEditor === 'tiptap'" class="flex-1 overflow-hidden flex flex-col hidden">
                  <!-- Tiptap toolbar -->
                  <div class="flex flex-wrap items-center gap-0.5 px-2 py-1.5 border-b border-gray-200 bg-white flex-shrink-0">
                    <button @click="tiptapCmd('heading', {level: 1})" :class="tiptapActive('heading', {level:1}) ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">H1</button>
                    <button @click="tiptapCmd('heading', {level: 2})" :class="tiptapActive('heading', {level:2}) ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">H2</button>
                    <button @click="tiptapCmd('heading', {level: 3})" :class="tiptapActive('heading', {level:3}) ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">H3</button>
                    <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                    <button @click="tiptapCmd('bold')" :class="tiptapActive('bold') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn font-bold">B</button>
                    <button @click="tiptapCmd('italic')" :class="tiptapActive('italic') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn italic">I</button>
                    <button @click="tiptapCmd('strike')" :class="tiptapActive('strike') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn"><s>S</s></button>
                    <button @click="tiptapCmd('code')" :class="tiptapActive('code') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn font-mono">`</button>
                    <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                    <button @click="tiptapCmd('bulletList')" :class="tiptapActive('bulletList') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">• List</button>
                    <button @click="tiptapCmd('orderedList')" :class="tiptapActive('orderedList') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">1. List</button>
                    <button @click="tiptapCmd('blockquote')" :class="tiptapActive('blockquote') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">&ldquo; Quote</button>
                    <button @click="tiptapCmd('codeBlock')" :class="tiptapActive('codeBlock') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn font-mono">&lt;/&gt;</button>
                    <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                    <button @click="tiptapInsertImage()" class="tiptap-btn hover:bg-gray-100">Image</button>
                    <button @click="tiptapSetLink()" :class="tiptapActive('link') ? 'bg-gray-200' : 'hover:bg-gray-100'" class="tiptap-btn">Link</button>
                    <div class="w-px h-4 bg-gray-200 mx-0.5"></div>
                    <button @click="tiptapCmd('clearNodes')" class="tiptap-btn hover:bg-gray-100" title="Clear formatting">Clear</button>
                  </div>
                  <div id="tiptap-editor" class="flex-1 overflow-y-auto"></div>
                </div>
                <!-- Markdown preview panel -->
                <div v-show="activeEditor === 'markdown'" class="flex-1 overflow-hidden flex flex-col bg-gray-50">
                  <textarea v-model="markdownOutput" spellcheck="false" @blur="onMarkdownBlur"
                    class="flex-1 w-full h-full p-6 text-xs font-mono text-gray-700 bg-gray-50 border-none outline-none resize-none leading-relaxed"></textarea>
                </div>
              </div>

            </div>
          </div>
        </div>
      </transition>

      <!-- Article Preview Drawer -->
      <transition name="drawer">
        <div v-if="previewPost" class="fixed inset-0 z-50 flex justify-start">
          <!-- Backdrop -->
          <div class="absolute inset-0 bg-black/50" @click="closePreview()"></div>

          <!-- Drawer panel -->
          <div class="relative w-full bg-white shadow-2xl flex flex-col h-full overflow-hidden" style="width: 100%; max-width: 100%;" :style="isMobile ? {} : { width: 'calc(4/6 * 100%)' }">
            <!-- Preview banner -->
            <div class="bg-amber-50 border-b border-amber-200 px-6 py-2 flex items-center justify-center gap-2 flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <p class="text-xs text-amber-700">
                This is only a preview.
                <a v-if="previewPost.published" :href="liveUrl(previewPost)" target="_blank" class="font-semibold underline hover:text-amber-900 transition">View the live version</a>
              </p>
            </div>

            <!-- Drawer header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 flex-shrink-0">
              <span class="text-sm font-semibold text-gray-600">Preview</span>
              <button @click="closePreview()" class="p-1.5 rounded-md text-gray-400 hover:bg-gray-100 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>

            <!-- Drawer content -->
            <div class="overflow-y-auto flex-1 px-6 py-6">
              <div class="w-full">
              <!-- Status badge -->
              <div class="mb-3">
                <span :class="previewPost.published ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                  class="px-2 py-0.5 rounded-full text-xs font-medium">
                  {{ previewPost.published ? 'Published' : 'Draft' }}
                </span>
              </div>

              <!-- Title -->
              <h1 class="text-2xl font-bold text-gray-900 mb-4 leading-snug">{{ previewPost.fm.title }}</h1>

              <!-- Author + Share row -->
              <div class="flex items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-100">
                <!-- Author info -->
                <div class="flex items-center gap-3">
                  <img
                    src="https://d1rl40o93nnuyl.cloudfront.net/posts/567/892e461772016837-17.png"
                    class="w-10 h-10 rounded-full object-cover bg-gray-100 flex-shrink-0"
                  />
                  <div>
                    <p class="text-sm font-semibold text-gray-800">{{ previewPost.fm.author ?? '—' }}</p>
                    <p class="text-xs text-gray-400">
                      {{ previewPost.fm.published_at || previewPost.fm.published_date || previewPost.published_at
                        ? new Date(previewPost.fm.published_at || previewPost.fm.published_date || previewPost.published_at).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' })
                        : '—' }}
                    </p>
                    <p v-if="previewPost.fm.editor" class="text-xs text-gray-400">Edited by {{ previewPost.fm.editor }}</p>
                  </div>
                </div>

                <!-- Share buttons -->
                <div class="flex items-center gap-2 flex-shrink-0">
                  <!-- Facebook -->
                  <button class="p-2 rounded-full bg-blue-600 text-white hover:bg-blue-700 transition" title="Share on Facebook">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
                  </button>
                  <!-- X / Twitter -->
                  <button class="p-2 rounded-full bg-black text-white hover:bg-gray-800 transition" title="Share on X">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                  </button>
                  <!-- WhatsApp -->
                  <button class="p-2 rounded-full bg-green-500 text-white hover:bg-green-600 transition" title="Share on WhatsApp">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.125.558 4.122 1.533 5.855L.057 23.625a.75.75 0 00.918.918l5.77-1.476A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.713 9.713 0 01-4.946-1.352l-.355-.21-3.666.938.955-3.574-.231-.368A9.712 9.712 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
                  </button>
                  <!-- Copy link -->
                  <button class="p-2 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition" title="Copy link">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                  </button>
                </div>
              </div>

              <!-- Feature image -->
              <div v-if="previewPost.fm.img_big_1000x600" class="w-full mb-6" style="aspect-ratio: 1200/630;">
                <img :src="previewPost.fm.img_big_1000x600"
                  class="w-full h-full object-cover rounded-xl bg-gray-100" />
              </div>

              <!-- Body -->
              <div class="prose prose-sm max-w-none text-gray-700 leading-relaxed"
                v-html="renderedContent(previewPost.content)">
              </div>
              </div>
            </div>
          </div>
        </div>
      </transition>

      <!-- Image insert modal -->
      <div v-if="imageInsertModal.visible" class="fixed inset-0 z-[9999] flex items-center justify-center">
        <div class="absolute inset-0 bg-black/40" @click="imageInsertModal.visible = false"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-4">Insert Image</h3>
          <div class="flex gap-2 mb-4">
            <input v-model="imageInsertModal.url" type="url" placeholder="https://..."
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
              @keydown.enter="insertImageByUrl" autofocus />
            <button @click="insertImageByUrl"
              class="px-4 py-2 bg-blue-500 text-white text-sm rounded-lg hover:bg-blue-600 transition font-medium">
              Insert
            </button>
          </div>
          <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs text-gray-400">or</span>
            <div class="flex-1 h-px bg-gray-200"></div>
          </div>
          <button @click="insertImageFromDevice"
            class="w-full px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition font-medium">
            Upload from device
          </button>
        </div>
      </div>

      <!-- Mobile action sheet -->
      <transition name="action-sheet">
        <div v-if="actionSheet.visible" class="fixed inset-0 z-[9998] flex flex-col justify-end md:hidden">
          <div class="absolute inset-0 bg-black/40" @click="actionSheet.visible = false"></div>
          <div class="relative bg-white rounded-t-2xl shadow-2xl pb-safe">
            <!-- Handle -->
            <div class="flex justify-center pt-3 pb-1">
              <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
            </div>
            <!-- Post title -->
            <p class="text-xs text-gray-400 text-center px-6 py-2 truncate">{{ actionSheet.post?.fm.title }}</p>
            <div class="divide-y divide-gray-100 px-4 pb-4">
              <button @click="actionSheet.visible = false; viewPost(actionSheet.post)"
                class="flex items-center gap-4 w-full py-4 text-left text-gray-800">
                <span class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </span>
                <span class="font-medium">View Post</span>
              </button>
              <button @click="actionSheet.visible = false; editPost(actionSheet.post)"
                class="flex items-center gap-4 w-full py-4 text-left text-gray-800">
                <span class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </span>
                <span class="font-medium">Edit Post</span>
              </button>
              <button @click="actionSheet.visible = false; deletePost(actionSheet.post)"
                class="flex items-center gap-4 w-full py-4 text-left text-red-600">
                <span class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center flex-shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </span>
                <span class="font-medium">Delete Post</span>
              </button>
              <button @click="actionSheet.visible = false"
                class="flex items-center justify-center w-full py-4 text-gray-500 font-medium mt-1">
                Cancel
              </button>
            </div>
          </div>
        </div>
      </transition>

      <!-- Error banner (full-width top) -->
      <transition name="toast">
        <div v-if="toast.visible && toast.mode === 'error'"
          class="fixed top-0 left-0 right-0 z-[9999] flex items-center gap-3 px-5 py-3 text-sm text-red-800 bg-red-50 border-b border-red-200">
          <svg class="w-4 h-4 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <span class="flex-1">{{ toast.message }}</span>
        </div>
      </transition>

      <!-- Toast confirmation -->
      <transition name="toast">
        <div v-if="toast.visible && toast.mode !== 'error'"
          class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] flex text-white text-sm px-5 py-3.5 rounded-2xl shadow-2xl"
          :class="[
            (toast.mode === 'notify' || toast.mode === 'success-confirm') ? 'bg-green-600' : 'bg-gray-900',
            isMobile ? 'flex-col gap-3 items-center' : 'flex-row items-center gap-4'
          ]">
          <div class="flex items-center gap-2">
            <svg v-if="toast.mode === 'notify' || toast.mode === 'success-confirm'" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span>{{ toast.message }}</span>
          </div>
          <div v-if="toast.mode !== 'notify'" class="flex items-center justify-center gap-2">
            <button @click="toast.resolve(false)" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-xs font-medium">{{ toast.cancelLabel }}</button>
            <button @click="toast.resolve(true)"
              :class="toast.mode === 'success-confirm' ? 'bg-white text-green-700 hover:bg-green-50' : 'bg-red-500 hover:bg-red-600'"
              class="px-3 py-1.5 rounded-lg transition text-xs font-medium">{{ toast.confirmLabel }}</button>
          </div>
        </div>
      </transition>
    </template>
  </div>

  <style>
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    .toast-enter-active, .toast-leave-active { transition: opacity 0.2s ease, transform 0.2s ease; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(-50%) translateY(-1rem); }

    .action-sheet-enter-active, .action-sheet-leave-active { transition: opacity 0.25s ease; }
    .action-sheet-enter-active .relative, .action-sheet-leave-active .relative { transition: transform 0.25s ease; }
    .action-sheet-enter-from, .action-sheet-leave-to { opacity: 0; }
    .action-sheet-enter-from .relative, .action-sheet-leave-to .relative { transform: translateY(100%); }

    .edit-drawer-enter-active, .edit-drawer-leave-active { transition: opacity 0.3s ease; }
    .edit-drawer-enter-active .relative, .edit-drawer-leave-active .relative { transition: transform 0.3s ease; }
