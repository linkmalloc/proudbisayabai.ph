      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const DB = firebase.firestore();
      DB.settings({timestampsInSnapshots: true});
      var posts = [];
      window.last_visible = null;

      var appendPostData = function(post){
        var created_at = ""
        var description = "";

        if (post.created_at){
          created_at = post.created_at.toDate()
        }

        if (post.description && post.description.length){
          description = post.description.substring(0,80);
        }

        let index = $('tr.blog-post').length + 1;

        var tr = `<tr class="blog-post">
          <td class="text-muted">${index}</td>
          <td><img style="width: 200px" src="${post.img_big_3000x1144}"/></td>
          <td>
            <p>${post.title}</p>
            <small class="d-block text-muted">${description}</small>
          </td>
          <td>${post.author}</td>
          <td style="width: 180px" >
            <a class="btn btn-primary btn-sm" href="/admin/create.html?edit=${post.id}">Edit</a>
            &nbsp;&nbsp;
            <a class="btn btn-secondary btn-sm" href="/admin/post.html?preview=${post.id}">Preview</a>
            </td>
          </tr>`;
        $('#posts-table').find('tbody').append(tr)
      }

      var initDashboard = function(){
        DB.collection("posts").orderBy("title", "asc").limit(10).get().then((querySnapshot) => {
          $('#posts-table tbody').html('')
          querySnapshot.forEach((doc) => {
            loadPosts(doc)
          });

          if (!querySnapshot.empty){
            showNextButton();
          }
        })
      }

      var showNextButton = function(){
        if (window.last_visible){
          $('#show_next').show();
        } else {
          $('#show_next').hide();
        }
      }

      var showNext = function(){
        if (window.last_visible){
          // DB.collection("posts").doc(window.last_visible).get().then((lastDoc)=>{
            DB.collection("posts").orderBy("title", "asc").startAfter(window.last_visible).limit(10).get().then((querySnapshot) => {
              querySnapshot.forEach((doc) => {
                loadPosts(doc)
              });
              if (querySnapshot.empty){
                window.last_visible = null;
              } else {
                showNextButton();
              }
            }).catch(function(){
              window.last_visible = null;
            })
          // })
        }
      }

      var loadPosts = function(doc){
        window.last_visible = doc;
        data = doc.data();
        data['id'] = doc.id;
        posts << data;
        appendPostData(data);
      }

      var showPost = function(post){

        //     console.log(err)
        //   });
      }

      $(document).on('click', '#create-post', function(){
        DB.collection("posts").add({
          title: "New Post",
          created_by: window.current_user_email
        })
        .then((docRef) => {
            console.log("Document written with ID: ", docRef.id);
            window.location = "/admin/create.html?edit=" + docRef.id;
        })
        .catch((error) => {
          console.error(error)
        });
      });

      var createPost = function(){
        
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          // User is signed in, see docs for a list of available properties
          // https://firebase.google.com/docs/reference/js/firebase.User
          var uid = user.uid;
          window.current_user_email = user.email;
          window.current_user = user.uid;
          console.log('User is signed in')
          $('#login').hide();
          $('#blog-tool').show()

          initDashboard();
        } else {
          // User is signed out
          $('#blog-tool').hide()
          $('#login').show();
          console.log('User is signed out')
        }
      });
      
      function login(email, password){
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .then(() => {
          return firebase.auth().signInWithEmailAndPassword(email, password);
        })
        .catch((error) => {
          // Handle Errors here.
          var errorCode = error.code;
          var errorMessage = error.message;
        });
      }

      $(document).ready(function(){
        $(document).on('submit', '#form-signin', function(e){
          e.preventDefault();
          console.log('logging in')
          var email = $('#inputEmail').val()
          var password = $('#inputPassword').val()

          login(email, password);
        })

        $('#logout').on('click', function(){
          firebase.auth().signOut().then(function() {
            window.location = '/admin/dashboard.html'
          }, function(error) {
          console.log('error')
          });
        })
      });
