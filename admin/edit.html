        <script>
            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyBCPzUyylI2kELAIDo-IryuIhcui3oXnXw",
                authDomain: "proudbisayabaiph.firebaseapp.com",
                projectId: "proudbisayabaiph",
                storageBucket: "proudbisayabaiph.appspot.com",
                messagingSenderId: "1000822839652",
                appId: "1:1000822839652:web:0e0678396ee723e3c3c271",
                measurementId: "G-HG59DT0Z7S"
              };
              // Initialize Firebase
              firebase.initializeApp(firebaseConfig);
              const DB = firebase.firestore();
              const Storage = firebase.storage();
        
              DB.settings({timestampsInSnapshots: true});
        
              var savePost = function(id){
                return new Promise((resolve, error) => {
                    var post = {
                        author: $('.author').val(),
                        author_image: '',
                        body: window.editor.codemirror.getValue(),
                        description: $('.description').val(),
                        categories: $('.category').val().split(","),
                        tags: $('.tags').val().split(","),
                        photo_credit: $('.photo_credit').val(),
                        photo_credit_link: $('.photo_credit_link').val(),
                        img_big_1000x600: $('.seo_image_url').val(),
                        img_big_3000x1144: $('.banner_image_url').val(),
                        img_500x500: $('.small_banner_image_url').val(),
                        img_500_1: $('.collage_image1_url').val(),
                        img_500_2: $('.collage_image2_url').val(),
                        img_500_3: $('.collage_image3_url').val(),
                        img_500_4: $('.collage_image4_url').val(),
                        img_500_5: $('.collage_image5_url').val(),
                        read_time: '4 minutes',
                        layout: 'post',
                        title: $('.title').val(),
                        place_name: $('.place_name').val(),
                        editor: $('.editor').val(),
                        read_time: $('.read_time').val()
                    }
        
                    DB.collection("posts").doc(`${id}`).set(post, {merge: true})
                        .then(() => {
                            console.log("Document successfully written!");
                            resolve();
                        })
                        .catch((error) => {
                            console.log("Error writing document: ", error);
                            error();
                        });
                });
              }
        
              var showEditForm = function(id){
                $(document).on('click', '#previewPost', function(){
                    savePost(id).then(function(){
                        let timerInterval
                        Swal.fire({
                        title: 'Good job!',
                        html: 'Blog post is saved, redirecting to the preview page. Please wait for a few seconds.',
                        timer: 2000,
                        timerProgressBar: true,
                        didOpen: () => {
                            Swal.showLoading()
                        },
                        willClose: () => {
                            console.log('willclose')
                        }
                        }).then((result) => {
                        /* Read more about handling dismissals below */
                        if (result.dismiss === Swal.DismissReason.timer) {
                            window.location = "/admin/preview.html?id="+id;
                        }
                        })
                        
                    }).catch((err) =>{
                        console.log(err)
                    });
                })
        
                $(document).on('click', '#savePost', function(){
                    savePost(id).then(function(){
                        Swal.fire(
                        'Good job!',
                        'The blog post is now saved!',
                        'success'
                        )
                    });
                })
        
                return new Promise((resolve, error) => {
                    setTimeout(function() {
                        $('.body-form').show();
                        $('.loader-wrapper').hide();
                    }, 2000);
        
                    $('title').html('Edit Post')
        
                    window.editor = new SimpleMDE({ element: $("#markdown_body")[0] });
                    window.editor.codemirror.on("update", function() {
                    value = window.editor.codemirror.getValue()
                    $("#markdown_body").text(value);
                    });
        
                    DB.collection('posts').doc(`${id}`).get().then((docRef) => {
                        data = docRef.data();
                        
                        var body_content = data.body.replace(/\\n/g, "\n");
                        body_content = body_content.replace(/\\t/g, "\t");
                        window.editor.codemirror.setValue(body_content);
        
                        $('.title').val(data.title)
                        $('.author').val(data.author)
                        $('.description').val(data.description)
                        $('.category').val(data.categories.join(','))
                        $('.tags').val(data.tags.join(','));
                        $('.photo_credit').val(data.photo_credit)
                        $('.photo_credit_link').val(data.photo_credit_link)
                        $('.seo_image_url').val(data.img_big_1000x600)
                        $('.banner_image_url').val(data.img_big_3000x1144)
                        $('.small_banner_image_url').val(data.img_500x500)
                        $('.collage_image1_url').val(data.img_500_1)
                        $('.collage_image2_url').val(data.img_500_2)
                        $('.collage_image3_url').val(data.img_500_3)
                        $('.collage_image4_url').val(data.img_500_4)
                        $('.collage_image5_url').val(data.img_500_5)
                        $('.editor').val(data.editor)
                        $('.read_time').val(data.read_time)
        
                        $('.place_name').val(data.place_name)
                        resolve()
                    }).catch(function(err){
                        console.log(err)
                        error()
                    });
                });
              }
        
              $(document).ready(function(){
                let searchParams = new URLSearchParams(window.location.search)
                showEditForm(searchParams.get('id'))
              })
        </script>
