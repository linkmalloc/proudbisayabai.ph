    $(document).ready(function() {

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const DB = firebase.firestore();
    DB.settings({timestampsInSnapshots: true});

    $(document).on('click', '#convert_as_blog', function(){
      if(confirm("Are you sure you want to convert this to a post?")){
        DB.collection("posts").add({
          title: $('#title').html(),
          body: $('#message').html(),
          created_by: "jmanuel.derecho@gmail.com",
          created_at: firebase.firestore.Timestamp.now()
        })
        .then((docRef) => {
            window.open("/admin/create.html?edit=" + docRef.id, '_blank');
        })
        .catch((error) => {
          console.error(error)
        });
      }
    })

  </script>
