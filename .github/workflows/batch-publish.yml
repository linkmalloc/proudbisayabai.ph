name: Build and Deploy to Netlify
on:
  push:
    branches:
      - master  # Adjust this if your primary branch is named "master"
      
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Matches your local environment
          bundler-cache: false # Speeds up builds by caching gems

      - name: Install Dependencies
        run: |
          # Force bundler to update and solve for Jekyll 4
          bundle update jekyll
          bundle install

      - name: Commit Gemfile.lock back to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add Gemfile.lock
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: force-sync Gemfile.lock" && git push)

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build --incremental
        env:
          JEKYLL_ENV: production

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=_site --prod
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}