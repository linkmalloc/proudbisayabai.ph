name: Build and Deploy to Netlify
on:
  push:
    branches:
      - master  # Adjust this if your primary branch is named "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' #Matches your local environment
          bundler-cache: true # Speeds up builds by caching gems

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build --incremental
        env:
          JEKYLL_ENV: production

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=_site --prod --message "Deploy from GitHub Actions"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}