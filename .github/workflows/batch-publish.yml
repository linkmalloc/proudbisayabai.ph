name: Build and Deploy to Netlify
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build from scratch (skip incremental cache)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Cache Jekyll build
        if: ${{ !inputs.full_build }}
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-metadata
            _site
          key: jekyll-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jekyll-${{ runner.os }}-

      - name: Build Jekyll Site
        run: |
          if [ "${{ inputs.full_build }}" = "true" ]; then
            echo "Running full build..."
            bundle exec jekyll build
          else
            echo "Running incremental build..."
            bundle exec jekyll build --incremental
          fi
        env:
          JEKYLL_ENV: production

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=_site --prod --no-build --message "Direct upload from GH Actions"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
