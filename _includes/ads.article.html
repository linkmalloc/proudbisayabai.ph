{% assign ad = include.ad %}
<article class="col-lg-4 col-md-6 mb-30 wow fadeInUp animated adspace" data-wow-delay="0.2s">
    <div class="post-card-1 border-radius-10 hover-up">
        <div class="post-thumb thumb-overlay img-hover-slide position-relative" style="background-image: url({{ ad.img_big_3000x1144 }})">
            <a class="img-link" href="{{ ad.url }}"></a>
            <span class="top-right-icon bg-success"><i class="elegant-icon icon_camera_alt"></i></span>
            <ul class="social-share">
                <li><a href="{{ ad.facebook }}"><i class="elegant-icon social_share"></i></a></li>
                <li><a class="fb" href="{{ ad.facebook }}" title="Share on Facebook" target="_blank"><i class="elegant-icon social_facebook"></i></a></li>
                <li><a class="tw" href="{{ ad.twitter }}" target="_blank" title="Tweet now"><i class="elegant-icon social_twitter"></i></a></li>
                <li><a class="pt" href="{{ ad.youtube }}" target="_blank" title="Pin it"><i class="elegant-icon social_pinterest"></i></a></li>
            </ul>
        </div>
        <div class="post-content p-30">
            <div class="entry-meta meta-0 font-small mb-10">
                <a href="{{ site.data.ads.url_services }}"><span class="post-cat text-info">Ad Space</span></a>
                <a href="{{ ad.click_url }}"><span class="post-cat text-success">{{ ad.title }}</span></a>
            </div>
            <div class="d-flex post-card-content">
                <h5 class="post-title mb-20 font-weight-900">
                    <a href="{{ ad.click_url }}">{{ ad.sub_title }}</a>
                </h5>
                <div class="entry-meta meta-1 float-left font-x-small text-uppercase">
                    <span class="post-on">{{ ad.description }}</span>
                    
                </div>
            </div>
        </div>
    </div>
</article>
