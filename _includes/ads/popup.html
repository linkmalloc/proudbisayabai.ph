<!--More posts-->
<div class="single-more-articles border-radius-5">
    <div class="widget-header-2 position-relative mb-30">
        <h5 class="mt-5 mb-30">You might be interested in</h5>
        <button class="single-more-articles-close"><i class="elegant-icon icon_close"></i></button>
    </div>
    <div class="post-block-list post-module-1 post-module-5">
        <ul class="list-post">
            <li class="mb-30">
                <div class="d-flex hover-up-2 transition-normal">
                    <div class="post-thumb post-thumb-80 d-flex mr-15 border-radius-5 img-hover-scale overflow-hidden">
                        <a class="color-white be-featured-btn" href="/services">
                            <video autoplay="autoplay" muted loop="true">
                                <source src="{{ site.s3_public }}/images/ads/pbb.mp4" type="video/mp4">
                                <source src="{{ site.s3_public }}/images/ads/pbb.ogg" type="video/ogg">
                                Your browser does not support the video tag.
                              </video>
                        </a>
                    </div>
                </div>
            </li>
            {% comment %}
            <li class="mb-10">
                <div class="d-flex hover-up-2 transition-normal sponsor">
                    <div class="post-thumb post-thumb-80 d-flex mr-15 border-radius-5 img-hover-scale overflow-hidden">
                        <a class="color-white" href="single.html">
                            <span class="img ignore-viewer" style="display: block; width=90px; background-image: url(http://via.placeholder.com/500x500)" alt=""></span>
                        </a>
                    </div>
                    <div class="post-content media-body">
                        <h6 class="post-title mb-15 text-limit-2-row font-medium"><a href="/services">20 Photos to Inspire You to Visit Cambodia</a></h6>
                        <div class="entry-meta meta-1 float-left font-x-small text-uppercase">
                            <span class="post-on">27 August</span>
                            <span class="post-by has-dot">14k views</span>
                        </div>
                    </div>
                </div>
            </li>
            {% endcomment %}
        </ul>
    </div>
</div>
