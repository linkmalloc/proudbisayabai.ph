{% assign image_big = page.img_big_3000x1144 %}
{% unless image_big %}
    {% assign image_big = site.data.defaults.pageholder.img_big_3000x1144 %}
{% endunless %}

<meta property="og:url"                content="h{{ page.url }}" />
<meta property="og:type"               content="article" />
<meta property="og:title"              content="{{ page.title }}" />
<meta property="og:description"        content="{{ page.content | truncatewords: 50 }}" />
<meta property="og:image"              content="{{ image_big }}" />
